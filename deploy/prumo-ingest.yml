# Candidate include for the existing web stack; the controller installs it on f0nix.
services:
  prumo-ingest:
    build:
      context: ${DOCKER_DIR}/stacks/web/images/prumo
      dockerfile: Dockerfile
    image: prumo-ingest:latest
    container_name: prumo-ingest
    command: ["python", "-u", "-m", "ingest.scheduler"]
    restart: unless-stopped
    # Same uid as the backoffice, which writes the editorial composition into the same SQLite
    # file. SQLite needs every writing process able to write the database, its -wal and its
    # -shm; a root worker leaves 0644 root:root files that uid 1000 cannot write, so the
    # editor would 503 on its first POST. The data directory is chowned to 1000 once at
    # deploy (docs/data/operations.md); the image writes nothing outside /data.
    user: "1000:1000"
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
    environment:
      TZ: ${TZ}
      PRUMO_DB_PATH: /data/prumo.sqlite3
      PRUMO_RAW_DIR: /data/raw
      PYTHONUNBUFFERED: "1"
      # SIGBUS has no Python traceback. This prints the Python stack on a native fault.
      PYTHONFAULTHANDLER: "1"
      FRED_API_KEY: ${FRED_API_KEY:-}
    volumes:
      - ${DOCKER_DIR}/stacks/web/appdata/prumo:/data:rw
      - ${DOCKER_DIR}/resolv.conf:/etc/resolv.conf:ro
    networks:
      - t2_proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
