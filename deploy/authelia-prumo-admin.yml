# Prumo Admin Authelia rules - a fragment, NOT a complete configuration and NOT applied
# by this repository.
#
# Insert this rule as the FIRST entry under `access_control.rules` in
# /home/joao/docker/stacks/core/appdata/authelia/configuration.yml, before the external
# wall, the `group:bots` rules and the generic `two_factor` catch-alls. Authelia evaluates
# rules top to bottom and takes the first match.
#
# This rule deliberately has no `subject`. It scopes authentication, not authorization:
# an anonymous visitor is sent to the login portal for a second factor instead of getting
# a dead-end 403. Every authenticated identity then reaches Traefik, where
# `prumo-admin-inject-secret` supplies the shared secret and the backoffice's verified
# identity allowlist admits only `PRUMO_ADMIN_USER` (default `joao`). Any other Authelia
# user is refused by the app with 401 before HTML or database content is served.
#
# Keep the regex an exact path boundary so `/dados/administration` is not swallowed.
access_control:
  rules:
    - domain: "joao.date"
      resources:
        - '^/dados/admin(/.*)?$'
      policy: two_factor
