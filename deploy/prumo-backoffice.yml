# Candidate include for the existing web stack; the controller installs it on f0nix.
# Strictly read-only operator view: data mounted :ro, Tailscale address only, no Traefik route.
services:
  prumo-backoffice:
    build:
      context: ${DOCKER_DIR}/stacks/web/images/prumo
      dockerfile: Dockerfile
    image: prumo-backoffice:latest
    container_name: prumo-backoffice
    command: ["uvicorn", "backoffice.app:app_from_env", "--factory", "--host", "0.0.0.0", "--port", "8080", "--workers", "1"]
    restart: unless-stopped
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    ports:
      - "100.118.19.6:8089:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      TZ: ${TZ}
      PRUMO_DB_PATH: /data/prumo.sqlite3
      PRUMO_RAW_DIR: /data/raw
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${DOCKER_DIR}/stacks/web/appdata/prumo:/data:ro
      - ${DOCKER_DIR}/resolv.conf:/etc/resolv.conf:ro
    networks:
      - t2_proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
