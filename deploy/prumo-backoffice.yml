# Candidate include for the existing web stack; the controller installs it on f0nix.
# Strictly read-only operator view: data mounted :ro, Tailscale address only, no Traefik route.
# Hardening (backoffice review Important 4):
# - own plain bridge network, not t2_proxy: nothing on the Traefik network can reach :8080.
#   Not `internal: true`, because Docker publishes no ports for a container attached only
#   to internal networks; the 100.118.19.6 bind stays the perimeter.
# - no resolv.conf mount: the app makes no outbound call and no DNS lookup.
# - read-only root filesystem (+ tmpfs /tmp), every capability dropped, no-new-privileges.
# - runs as uid 1000: RawStore writes raw evidence 0644 (public-source bytes) so the replay page
#   can read it. Files written by a worker image older than that change are 0600 root and need
#   a one-off `chmod -R a+rX` of the raw store (see docs/data/operations.md).
services:
  prumo-backoffice:
    build:
      context: ${DOCKER_DIR}/stacks/web/images/prumo
      dockerfile: Dockerfile
    image: prumo-backoffice:latest
    container_name: prumo-backoffice
    command: ["uvicorn", "backoffice.app:app_from_env", "--factory", "--host", "0.0.0.0", "--port", "8080", "--workers", "1"]
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "100.118.19.6:8089:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      TZ: ${TZ}
      PRUMO_DB_PATH: /data/prumo.sqlite3
      PRUMO_RAW_DIR: /data/raw
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${DOCKER_DIR}/stacks/web/appdata/prumo:/data:ro
    networks:
      - prumo_backoffice
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  prumo_backoffice:
    name: prumo_backoffice
    driver: bridge
