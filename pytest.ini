[pytest]
# Pytest configuration for CAE Dashboard testing

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -m "not live"

# Markers
markers =
    integration: Integration tests (require DB/API)
    unit: Unit tests (no external dependencies)
    slow: Slow tests
    skipif: Tests that may be skipped in some environments
    live: Hits real publisher APIs over the network; deselected by default, run with -m live

# Coverage configuration lives in .coveragerc (consumed by pytest-cov/coverage.py
# for both app and ingest); the [coverage:*] sections previously here were never
# read from pytest.ini. CI passes explicit --cov=app --cov=ingest flags.
