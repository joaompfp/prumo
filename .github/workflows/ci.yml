name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Supported runtime only; retained historical collectors/ are not part of
      # the new runtime and are outside the lint gate.
      - run: ruff check app/ ingest/ --output-format=github

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Runtime requirements plus test-only tools (requirements-dev.txt, never in the
      # image). The ingest pipeline runs on sqlite3 and never imports DuckDB/pyarrow;
      # the legacy seed scripts are not exercised in CI.
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      # Full offline suite. pytest.ini's default `not live` selection applies;
      # real publisher (live) tests never run in CI.
      - name: Run tests
        run: pytest tests/ --cov=app --cov=ingest --cov-branch --cov-report=term-missing
