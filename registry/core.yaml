# PROVISIONAL — owner review pending
# Generated by ingest/propose_registry.py from the legacy export; see overlaps.md, deferred-tail.md, unclassified.md, licences-todo.md.
sources:
  bportugal:
    # BPstat legal notices (licence_url), section "Direitos de autor", read live 2026-11-11:
    #   "A utilização da informação obtida diretamente no BPstat é livre, mas está sujeita às
    #    seguintes condições: A distribuição ou reprodução da informação deve efetuar-se com
    #    exatidão e referir o Banco de Portugal como a fonte; Se a informação for modificada pelo
    #    utilizador, tal facto deve ser explicitamente mencionado."
    # i.e. free redistribution with attribution, exact reproduction, modifications must be marked.
    licence: BPstat legal notices — free use with attribution (exact reproduction, modifications must be marked)
    licence_url: https://bpstat.bportugal.pt/avisos-legais
    attribution: 'Fonte: Banco de Portugal'
    redistribution_ok: true
    verifiable: true  # independent channel: portal internal API /api/observations/ + /api/series/ (verifier ingest.verifiers.bportugal)
  dgeg:
    licence: UNVERIFIED — builder must confirm before serving
    licence_url: https://www.dgeg.gov.pt/
    attribution: 'Source: DGEG'
    redistribution_ok: false
    # Task 12B disposition (2026-11-11), registry/unmapped-dgeg.md: SCOPED eligibility flag only —
    # the 17 DGEG series below, WITH THEIR CURRENT core definitions (units, coordinates, concepts),
    # have no established independent exact verification channel, and there is no DGEG ingest
    # adapter or verifier at all. This blocks a normal run (run_with_refetch raises before any
    # fetch); it is NOT a claim that DGEG data can never be verified: partial same-publisher
    # channels exist (APN/AEN PDFs; see unmapped-dgeg.md per-series resumption criteria). No new
    # live DGEG collection has run; Task-8 legacy imports remain unchanged. All 17 series are
    # active:false and stay out of T17/T18 scheduling.
    verifiable: false
  eurostat:
    licence: CC BY 4.0
    licence_url: https://ec.europa.eu/eurostat/web/main/help/copyright-notice
    attribution: 'Source: Eurostat'
    redistribution_ok: true
  fred:
    licence: UNVERIFIED — builder must confirm before serving
    licence_url: https://fred.stlouisfed.org/docs/api/terms_of_use.html
    attribution: 'Source: IMF Primary Commodity Prices, via FRED (Federal Reserve Bank of St. Louis)'
    redistribution_ok: false
  ine:
    licence: CC BY 4.0
    licence_url: https://www.ine.pt/xportal/xmain?xpid=INE&xpgid=ine_cont_inst&INST=3585857
    # INE's terms page gives this authoritative Portuguese acknowledgement wording;
    # English variant kept for reference: 'Source: Instituto Nacional de Estatística – Portugal
    # (Statistics Portugal) (identification of the statistical information mentioned; reference
    # period of the information)'
    attribution: 'Fonte: Instituto Nacional de Estatística, IP – Portugal (identificação da informação estatística referida, período de referência da informação)'
    redistribution_ok: true
    timeout_s: 300  # its JSON API takes 17-45 s per request (trade 170-236 s); client default is 30 s
    verifiable: true  # independent channel exists: bddXplorer HTML table (verifier ingest.verifiers.ine)
  oecd:
    licence: UNVERIFIED — builder must confirm before serving
    licence_url: https://www.oecd.org/termsandconditions/
    attribution: 'Source: OECD'
    redistribution_ok: false
  ren:
    # REN DataHub "Termos Legais e Condições Gerais" (licence_url), read live 2026-11-11
    # (Task 12 discovery archive terms/datahub-termos.body): clause 2 reserves all exploitation
    # rights ("sem que se possa considerar cedido ao Utilizador nenhum dos direitos de
    # exploração") and clause 3.2 makes the user abstain from "Reproduzir, copiar, distribuir,
    # colocar à disposição, comunicar publicamente, transformar ou alterar os Conteúdos, salvo
    # nos casos autorizados na lei ou expressamente consentidos pela REN" and from extracting or
    # reusing "a totalidade ou uma parte substancial dos Conteúdos ... assim como as bases de
    # dados". No open reuse grant exists -> redistribution_ok stays FALSE: data may be verified
    # internally but served=0 (licence gate, migration 0005) until the owner resolves terms with
    # REN. See registry/licences-todo.md.
    licence: REN DataHub Termos Legais — no open reuse grant (clauses 2/3.2 reserve reproduction, distribution and substantial extraction to express REN consent)
    licence_url: https://datahub.ren.pt/pt/termos-legais-e-condicoes-gerais/
    attribution: 'Source: REN — Redes Energéticas Nacionais'
    redistribution_ok: false
    verifiable: true  # independent channel: datahub.ren.pt /service/exports/csv chart export (verifier ingest.verifiers.ren)
  worldbank:
    licence: CC BY 4.0
    licence_url: https://datacatalog.worldbank.org/public-licenses
    attribution: 'Source: World Bank'
    redistribution_ok: true
